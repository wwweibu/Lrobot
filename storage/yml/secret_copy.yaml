# 重要的配置信息，未使用参数的留空，所有配置均为可选

# 服务器（若采用方案 B 填写，用于本地连接服务器）
SERVER_IP: '' # IP 地址
SERVER_USERNAME: '' # 登录账号

# 域名（用于网址发送）
HOST: ''

# LR232
LR232_ID: '' # QQ 开放平台 AppID
LR232_SECRET: '' # QQ 开放平台 AppSecret
LR232_QQ: '' # QQ 开放平台机器人 QQ 号（用于在 LR5921 过滤掉 LR232 的消息）

# LR5921
LR5921_ID: '' # 机器人的 QQ 号（用于作为转发消息的用户）

# WECHAT
WECHAT_ID: '' # 微信开放平台 AppID
WECHAT_SECRET: '' # 微信开放平台 AppSecret
WECHAT_SELF: '' # 账号原始 ID（用于消息发送）
WECHAT_TOKEN: '' # 账号回调地址验证的令牌

# BILI
BILI_SESSDATA: '' # B 站 cookie 中的 SESSDATA
BILI_JCT: '' # B 站 cookie 中的 bili_jct
BILI_UID: ''  # B 站的 uid
BILI_UUID: '' # B 站 cookie 中的 _uuid
BILI_LIVE_ID: ''  # B 站的直播间 id（用于开启直播）
